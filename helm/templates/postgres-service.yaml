apiVersion: v1
kind: Service
metadata:
  name: {{ include "rewind.postgresFullname" . }}
  labels:
    {{- include "rewind.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "rewind.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
