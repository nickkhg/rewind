apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rewind.fullname" . }}
  labels:
    {{- include "rewind.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Plaintext token read by the hash-admin-token init container.
  # The hashed value is placed on a shared emptyDir and exported
  # as ADMIN_TOKEN_HASH when the main container starts.
  admin-token: {{ .Values.secrets.adminToken | quote }}
  # PostgreSQL password used by the postgres StatefulSet container.
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  # Full connection string used by the rewind server.
  database-url: {{ include "rewind.databaseUrl" . | quote }}
