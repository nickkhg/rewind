apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rewind.fullname" . }}
  labels:
    {{- include "rewind.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Plaintext token read by the hash-admin-token init container.
  # The hashed value is placed on a shared emptyDir and exported
  # as ADMIN_TOKEN_HASH when the main container starts.
  admin-token: {{ .Values.secrets.adminToken | quote }}
  # GIPHY web SDK key, exported as GIPHY_API_KEY on the main container.
  giphy-api-key: {{ .Values.secrets.giphyApiKey | quote }}
  # The Entra app registration, exported as ENTRA_* on the main container. All three empty leaves
  # the server open, as it was before there was a sign-in at all.
  entra-tenant-id: {{ .Values.secrets.entra.tenantId | quote }}
  entra-client-id: {{ .Values.secrets.entra.clientId | quote }}
  entra-client-secret: {{ .Values.secrets.entra.clientSecret | quote }}
  # PostgreSQL password used by the postgres StatefulSet container.
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  # PostgreSQL host used by the rewind server.
  postgres-host: {{ include "rewind.postgresFullname" . | quote }}
  # PostgreSQL username used by the rewind server.
  postgres-username: {{ .Values.postgres.auth.username | quote }}
  # PostgreSQL database name used by the rewind server.
  postgres-database: {{ .Values.postgres.auth.database | quote }}
