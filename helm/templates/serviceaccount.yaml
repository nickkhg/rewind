{{- if .Values.ai.workloadIdentity.clientId }}
# The identity the server signs in to Foundry as. The annotation names the managed identity, and
# the federated credential on that identity names this service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rewind.fullname" . }}
  labels:
    {{- include "rewind.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.ai.workloadIdentity.clientId | quote }}
{{- end }}
