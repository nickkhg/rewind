{{- if and .Values.ingress.enabled (eq .Values.ingress.tls.mode "manual") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rewind.tlsSecretName" . }}
  labels:
    {{- include "rewind.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "ingress.tls.manual.cert is required when tls.mode=manual" .Values.ingress.tls.manual.cert | quote }}
  tls.key: {{ required "ingress.tls.manual.key is required when tls.mode=manual" .Values.ingress.tls.manual.key | quote }}
{{- end }}
