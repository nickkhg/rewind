replicaCount: 1

image:
  repository: ghcr.io/nickkhg/rewind
  tag: "1.6.1"
  pullPolicy: IfNotPresent

# List of pull secret names to attach to all pods.
# Example:
#   imagePullSecrets:
#     - name: ghcr-pull-secret
imagePullSecrets: []

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: ""
  # Extra annotations merged onto the Ingress resource.
  # cert-manager annotations are added automatically when tls.mode=certManager.
  annotations: {}
  hosts:
    - host: rewind.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    # mode controls how TLS is provisioned. Options:
    #   none          — no TLS (plain HTTP ingress)
    #   certManager   — cert-manager issues and renews the certificate
    #   existingSecret — reference a pre-existing kubernetes.io/tls Secret
    #   manual        — provide the PEM cert+key directly in values
    mode: none

    certManager:
      # Name of the ClusterIssuer or Issuer cert-manager should use.
      issuer: letsencrypt-prod
      # ClusterIssuer (cluster-wide) or Issuer (namespace-scoped).
      issuerKind: ClusterIssuer
      # Name of the TLS Secret cert-manager will create.
      # Defaults to <fullname>-tls if left empty.
      secretName: ""

    existingSecret:
      # Name of a pre-existing kubernetes.io/tls Secret in the same namespace.
      name: ""

    manual:
      # PEM-encoded certificate (including any intermediates).
      cert: ""
      # PEM-encoded private key.
      key: ""
      # Name of the TLS Secret to create.
      # Defaults to <fullname>-tls if left empty.
      secretName: ""

resources: {}

# Plaintext secrets — the init container hashes adminToken via hash_admin_token
secrets:
  # Plaintext admin token; leave empty to disable the admin interface
  adminToken: ""
  # GIPHY web SDK key; leave empty to turn the GIF controls off.
  # The server passes this key to the browser at GET /api/config, because the GIPHY web SDK
  # calls GIPHY from the client. The key is therefore visible to anyone who uses the board.
  # Keeping it here holds it out of the image and out of git, and lets it rotate without a
  # rebuild, but it does not hide it from end users — use a domain-restricted key.
  giphyApiKey: ""
  # Entra sign-in. Leave all three empty and the server asks nobody to sign in, which is how it
  # has always worked: a board is open to whoever holds its link.
  #
  # Set all three and the whole app goes behind a work account — the API, the socket, and the page
  # itself. Anyone in the tenant gets in; who may do what on a board is still the facilitator token,
  # the editor list and the board password, exactly as before.
  #
  # All three or none. Half a configuration stops the server rather than serving every board to
  # anyone while looking configured.
  #
  # The app registration needs to be single-tenant, platform **Web** (only a confidential client may
  # hold a secret), with the redirect URI
  #   https://<your host>/api/auth/callback
  # A sign-out also sends the browser back to https://<your host>/, so add that as a redirect URI
  # too, or Entra ends the sign-out on a page of its own.
  entra:
    # The directory (tenant) ID of the app registration.
    tenantId: ""
    # The application (client) ID.
    clientId: ""
    # A client secret of the app registration. It never leaves the pod: the server runs the whole
    # sign-in and the browser only ever holds an encrypted cookie this server wrote.
    clientSecret: ""

env:
  port: "3001"
  rustLog: "info"
  # The origin the browser reaches Rewind on, for example https://rewind.example.com — the redirect
  # URI of a sign-in is built from it. Left empty, each request names its own host, from the
  # X-Forwarded-Proto and X-Forwarded-Host the ingress sets, which is right for a normal ingress.
  # Set it when a proxy in front rewrites the host, or when the sign-in comes back to the wrong URL.
  publicUrl: ""

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
  auth:
    username: rewind
    password: "changeme"
    database: rewind
  storage:
    size: 1Gi
  resources: {}
